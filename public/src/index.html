<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIL Robot Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 { margin-bottom: 1.5rem; }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
        }

        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .panel {
            background: #16213e;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 200px;
        }

        .panel label {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.5rem;
        }

        .panel input {
            padding: 0.5rem;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f3460;
            color: #eee;
            font-size: 1rem;
            width: 100%;
        }

        .btn {
            margin-top: 0.5rem;
            padding: 0.6rem;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-send { background: #27ae60; }
        .btn-send:hover { background: #219150; }
        .btn-telemetry { background: #8e44ad; }
        .btn-telemetry:hover { background: #733a8e; }

        /* Parameters panel (hidden until direction selected) */
        .params-panel { display: none; }
        .params-panel.visible { display: flex; }
        .params-panel .param-group { display: none; }
        .params-panel .param-group.visible { display: contents; }

        /* D-Pad */
        .dpad-panel { align-items: center; }

        .dpad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 6px;
        }

        .dpad-btn {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            color: #fff;
        }

        .dpad-btn:active { transform: scale(0.93); }

        .dpad-btn.up    { grid-column: 2; grid-row: 1; background: #0f3460; }
        .dpad-btn.left  { grid-column: 1; grid-row: 2; background: #0f3460; }
        .dpad-btn.center{ grid-column: 2; grid-row: 2; background: #e94560; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; background: #0f3460; }
        .dpad-btn.down  { grid-column: 2; grid-row: 3; background: #0f3460; }

        .dpad-btn.up:hover,
        .dpad-btn.down:hover,
        .dpad-btn.left:hover,
        .dpad-btn.right:hover { background: #1a5276; }

        .dpad-btn.center:hover { background: #c0392b; }

        /* Log panel */
        .log-panel {
            min-width: 350px;
            max-width: 500px;
        }

        .log-panel pre {
            background: #0a0a1a;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>COIL Robot Controller</h1>

    <!-- Robot Selector -->
    <div style="margin-bottom:1.5rem; display:flex; align-items:center; gap:1rem;">
        <label for="robot-select" style="font-size:0.9rem; color:#aaa;">Robot #:</label>
        <select id="robot-select" style="padding:0.5rem; border:1px solid #333; border-radius:6px; background:#0f3460; color:#eee; font-size:1rem;">
            <option value="0">Robot 0</option>
            <option value="1">Robot 1</option>
        </select>
    </div>

    <div class="controls-container">
        <!-- Packet Log (left) -->
        <div class="panel log-panel">
            <h2>Packet Log</h2>
            <pre id="log-output">Ready.</pre>
        </div>

        <!-- Movement + Parameters (center) -->
        <div class="center-column">
            <div class="panel dpad-panel">
                <h2>Movement</h2>
                <div class="dpad">
                    <button class="dpad-btn up" id="btn-forward" title="Forward">&#9650;</button>
                    <button class="dpad-btn left" id="btn-left" title="Left">&#9664;</button>
                    <button class="dpad-btn center" id="btn-sleep" title="Sleep">&#9211;</button>
                    <button class="dpad-btn right" id="btn-right" title="Right">&#9654;</button>
                    <button class="dpad-btn down" id="btn-backward" title="Backward">&#9660;</button>
                </div>
            </div>

            <div class="panel params-panel" id="params-panel">
                <h2 id="params-title">Parameters</h2>

                <div class="param-group" id="group-power">
                    <label for="power">Power (80-100%)</label>
                    <input type="number" id="power" min="80" max="100" value="80" />
                </div>

                <div class="param-group" id="group-duration">
                    <label for="duration">Duration (1-100s)</label>
                    <input type="number" id="duration" min="1" max="100" value="5" />
                </div>

                <button class="btn btn-send" id="btn-send">Send Command</button>
            </div>
        </div>

        <!-- Telemetry (right) -->
        <div class="panel">
            <h2>Telemetry</h2>
            <button class="btn btn-telemetry" id="btn-telemetry">Request Telemetry</button>
            <pre id="telemetry-output" style="background:#0a0a1a; padding:0.8rem; border-radius:6px; font-size:0.8rem; min-height:80px; margin-top:0.5rem;">No telemetry data.</pre>
        </div>
    </div>

    <script>
        var logOutput = document.getElementById("log-output");
        var paramsPanel = document.getElementById("params-panel");
        var paramsTitle = document.getElementById("params-title");
        var groupPower = document.getElementById("group-power");
        var groupDuration = document.getElementById("group-duration");
        var selectedCommand = null;

        function log(msg) {
            logOutput.textContent = msg + "\n" + logOutput.textContent;
        }

        function getRobotId() {
            return parseInt(document.getElementById("robot-select").value, 10);
        }

        // ---- VALIDATION ----
        function validatePower(value) {
            var n = parseInt(value, 10);
            return !isNaN(n) && n >= 80 && n <= 100;
        }

        function validateDuration(value) {
            var n = parseInt(value, 10);
            return !isNaN(n) && n >= 1 && n <= 100;
        }

        // ---- DIRECTION BUTTONS ----
        function showParams(command, fields) {
            selectedCommand = command;
            paramsTitle.textContent = command + " Parameters";

            groupPower.className = "param-group" + (fields.includes("power") ? " visible" : "");
            groupDuration.className = "param-group" + (fields.includes("duration") ? " visible" : "");

            paramsPanel.className = "panel params-panel visible";
        }

        document.getElementById("btn-forward").addEventListener("click", function() {
            showParams("Forward", ["power", "duration"]);
        });

        document.getElementById("btn-backward").addEventListener("click", function() {
            showParams("Backward", ["power", "duration"]);
        });

        document.getElementById("btn-left").addEventListener("click", function() {
            showParams("Left", ["duration"]);
        });

        document.getElementById("btn-right").addEventListener("click", function() {
            showParams("Right", ["duration"]);
        });

        document.getElementById("btn-sleep").addEventListener("click", function() {
            selectedCommand = "Sleep";
            paramsPanel.className = "panel params-panel";

            var robotId = getRobotId();
            log("Sending Sleep to Robot " + robotId + "...");
            fetch("/commands/sleep", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ robotId: robotId })
            })
            .then(function(res) { return res.text(); })
            .then(function(data) { log("Sleep response: " + data); })
            .catch(function(err) { log("ERROR: " + err.message); });
        });

        // ---- SEND COMMAND ----
        document.getElementById("btn-send").addEventListener("click", function() {
            if (!selectedCommand || selectedCommand === "Sleep") return;

            var duration = document.getElementById("duration").value;

            // Validate duration
            if (!validateDuration(duration)) {
                log("ERROR: Duration must be 1-100 seconds");
                return;
            }

            var directionMap = { "Forward": 1, "Backward": 2, "Right": 3, "Left": 4 };
            var directionInt = directionMap[selectedCommand];
            var robotId = getRobotId();
            var body = {
                Duration: parseInt(duration, 10)
            };

            // Validate and add power for Forward/Backward
            if (selectedCommand === "Forward" || selectedCommand === "Backward") {
                var power = document.getElementById("power").value;
                if (!validatePower(power)) {
                    log("ERROR: Power must be 80-100%");
                    return;
                }
                body.Power = parseInt(power, 10);
            }

            var msg = "Robot " + robotId + " | " + selectedCommand;
            if (body.Power) {
                msg += " | Power: " + body.Power + " | Duration: " + body.Duration + "s";
            } else {
                msg += " | Duration: " + body.Duration + "s";
            }
            log("Sending: " + msg);

            fetch("/commands/Drive/" + directionInt, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            })
            .then(function(res) { return res.json(); })
            .then(function(data) { log("Response: Ack=" + data.Ack_Flag + " " + data.body); })
            .catch(function(err) { log("ERROR: " + err.message); });
        });

        // ---- TELEMETRY REQUEST ----
        document.getElementById("btn-telemetry").addEventListener("click", function() {
            var robotId = getRobotId();
            log("Requesting telemetry for Robot " + robotId + "...");
            fetch("/commands/telemetry")
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var output = document.getElementById("telemetry-output");
                    output.textContent = "Ack: " + data.Ack;
                    log("Telemetry received (Ack=" + data.Ack + ")");
                })
                .catch(function(err) { log("ERROR: " + err.message); });
        });
    </script>
</body>
</html>
