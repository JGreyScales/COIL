<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIL Robot Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            margin-bottom: 1.5rem;
        }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .panel {
            background: #16213e;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 220px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

            .panel label {
                font-size: 0.85rem;
                color: #aaa;
                margin-top: 0.5rem;
            }

            .panel input,
            .panel select {
                padding: 0.5rem;
                border: 1px solid #333;
                border-radius: 6px;
                background: #0f3460;
                color: #eee;
                font-size: 1rem;
                width: 100%;
            }

        .btn {
            margin-top: 0.5rem;
            padding: 0.7rem;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

            .btn:active {
                transform: scale(0.97);
            }

        .btn-send {
            background: #27ae60;
        }

            .btn-send:hover {
                background: #219150;
            }

        .btn-telemetry {
            background: #8e44ad;
        }

            .btn-telemetry:hover {
                background: #733a8e;
            }

        .params-panel {
            display: none;
        }

            .params-panel.visible {
                display: flex;
            }

            .params-panel .param-group {
                display: none;
            }

                .params-panel .param-group.visible {
                    display: block;
                }

        .dpad-panel {
            align-items: center;
        }

        .dpad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 6px;
        }

        .dpad-btn {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            color: #fff;
        }

            .dpad-btn:active {
                transform: scale(0.93);
            }

            .dpad-btn.up {
                grid-column: 2;
                grid-row: 1;
                background: #0f3460;
            }

            .dpad-btn.left {
                grid-column: 1;
                grid-row: 2;
                background: #0f3460;
            }

            .dpad-btn.center {
                grid-column: 2;
                grid-row: 2;
                background: #e94560;
            }

            .dpad-btn.right {
                grid-column: 3;
                grid-row: 2;
                background: #0f3460;
            }

            .dpad-btn.down {
                grid-column: 2;
                grid-row: 3;
                background: #0f3460;
            }

                .dpad-btn.up:hover,
                .dpad-btn.down:hover,
                .dpad-btn.left:hover,
                .dpad-btn.right:hover {
                    background: #1a5276;
                }

            .dpad-btn.center:hover {
                background: #c0392b;
            }

        .log-panel {
            min-width: 350px;
            max-width: 500px;
        }

            .log-panel pre,
            .telemetry-panel pre {
                background: #0a0a1a;
                padding: 1rem;
                border-radius: 8px;
                font-size: 0.85rem;
                min-height: 200px;
                max-height: 400px;
                overflow-y: auto;
                white-space: pre-wrap;
                word-wrap: break-word;
            }

        .telemetry-panel {
            min-width: 320px;
            max-width: 420px;
        }

        .status-ok {
            color: #7bed9f;
        }

        .status-bad {
            color: #ff7675;
        }
    </style>
</head>
<body>
    <h1>COIL Robot Controller</h1>

    <div style="margin-bottom:1.5rem; display:flex; align-items:center; gap:1rem;">
        <label for="robot-select" style="font-size:0.9rem; color:#aaa;">Robot #:</label>
        <select id="robot-select">
            <option value="0">Robot 0</option>
            <option value="1">Robot 1</option>
        </select>
    </div>

    <div class="controls-container">
        <div class="panel log-panel">
            <h2>Packet Log</h2>
            <pre id="log-output">Ready.</pre>
        </div>

        <div class="center-column">
            <div class="panel dpad-panel">
                <h2>Movement</h2>
                <div class="dpad">
                    <button class="dpad-btn up" id="btn-forward" title="Forward">&#9650;</button>
                    <button class="dpad-btn left" id="btn-left" title="Left">&#9664;</button>
                    <button class="dpad-btn center" id="btn-sleep" title="Sleep">&#9211;</button>
                    <button class="dpad-btn right" id="btn-right" title="Right">&#9654;</button>
                    <button class="dpad-btn down" id="btn-backward" title="Backward">&#9660;</button>
                </div>
            </div>

            <div class="panel params-panel" id="params-panel">
                <h2 id="params-title">Parameters</h2>

                <div class="param-group" id="group-power">
                    <label for="power">Power (80-100%)</label>
                    <input type="number" id="power" min="80" max="100" value="80" />
                </div>

                <div class="param-group" id="group-duration">
                    <label for="duration">Duration (1-100s)</label>
                    <input type="number" id="duration" min="1" max="100" value="5" />
                </div>

                <button class="btn btn-send" id="btn-send">Send Command</button>
            </div>
        </div>

        <div class="panel telemetry-panel">
            <h2>Telemetry</h2>
            <button class="btn btn-telemetry" id="btn-telemetry">Request Telemetry</button>
            <pre id="telemetry-output">No telemetry data.</pre>
        </div>
    </div>

    <script>
        const logOutput = document.getElementById("log-output");
        const telemetryOutput = document.getElementById("telemetry-output");
        const paramsPanel = document.getElementById("params-panel");
        const paramsTitle = document.getElementById("params-title");
        const groupPower = document.getElementById("group-power");
        const groupDuration = document.getElementById("group-duration");

        let selectedCommand = null;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logOutput.textContent = "[" + time + "] " + msg + "\n" + logOutput.textContent;
        }

        function getRobotId() {
            return parseInt(document.getElementById("robot-select").value, 10);
        }

        function validateRobotId(value) {
            return value === 0 || value === 1;
        }

        function validatePower(value) {
            const n = parseInt(value, 10);
            return !isNaN(n) && n >= 80 && n <= 100;
        }

        function validateDuration(value) {
            const n = parseInt(value, 10);
            return !isNaN(n) && n >= 1 && n <= 100;
        }

        function showParams(command, fields) {
            selectedCommand = command;
            paramsTitle.textContent = command + " Parameters";

            groupPower.className = "param-group" + (fields.includes("power") ? " visible" : "");
            groupDuration.className = "param-group" + (fields.includes("duration") ? " visible" : "");

            paramsPanel.className = "panel params-panel visible";
        }

        function hideParams() {
            paramsPanel.className = "panel params-panel";
        }

        function commandToDirection(command) {
            switch (command) {
                case "Forward": return 1;
                case "Backward": return 2;
                case "Right": return 3;
                case "Left": return 4;
                default: return -1;
            }
        }

        async function fetchJson(url) {
            const response = await fetch(url, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            });

            const contentType = response.headers.get("content-type") || "";
            let data = null;

            if (contentType.includes("application/json")) {
                data = await response.json();
            } else {
                const text = await response.text();
                throw new Error("Server returned non-JSON response: " + text);
            }

            if (!response.ok) {
                throw new Error(data.error || data.body || ("HTTP " + response.status));
            }

            return data;
        }

        document.getElementById("btn-forward").addEventListener("click", function () {
            showParams("Forward", ["power", "duration"]);
        });

        document.getElementById("btn-backward").addEventListener("click", function () {
            showParams("Backward", ["power", "duration"]);
        });

        document.getElementById("btn-left").addEventListener("click", function () {
            showParams("Left", ["duration"]);
        });

        document.getElementById("btn-right").addEventListener("click", function () {
            showParams("Right", ["duration"]);
        });

        document.getElementById("btn-sleep").addEventListener("click", async function () {
            try {
                selectedCommand = "Sleep";
                hideParams();

                const robotId = getRobotId();
                if (!validateRobotId(robotId)) {
                    log("ERROR: robotId must be 0 or 1");
                    return;
                }

                const url = "/commands/sleep?robotId=" + encodeURIComponent(robotId);
                log("Sending Sleep to Robot " + robotId + "...");

                const data = await fetchJson(url);
                log("Sleep response: ack=" + data.ack + " body=\"" + (data.body || "") + "\"");
            } catch (err) {
                log("ERROR: " + err.message);
            }
        });

        document.getElementById("btn-send").addEventListener("click", async function () {
            try {
                if (!selectedCommand || selectedCommand === "Sleep") {
                    log("ERROR: Select a movement command first");
                    return;
                }

                const robotId = getRobotId();
                if (!validateRobotId(robotId)) {
                    log("ERROR: robotId must be 0 or 1");
                    return;
                }

                const duration = document.getElementById("duration").value;
                if (!validateDuration(duration)) {
                    log("ERROR: Duration must be 1-100 seconds");
                    return;
                }

                const direction = commandToDirection(selectedCommand);
                if (direction === -1) {
                    log("ERROR: Invalid direction selected");
                    return;
                }

                let url = "/commands/Drive/" + encodeURIComponent(direction)
                    + "?robotId=" + encodeURIComponent(robotId)
                    + "&duration=" + encodeURIComponent(parseInt(duration, 10));

                let logMessage = "Robot " + robotId + " | " + selectedCommand
                    + " | Duration: " + parseInt(duration, 10) + "s";

                if (selectedCommand === "Forward" || selectedCommand === "Backward") {
                    const power = document.getElementById("power").value;

                    if (!validatePower(power)) {
                        log("ERROR: Power must be 80-100%");
                        return;
                    }

                    url += "&power=" + encodeURIComponent(parseInt(power, 10));
                    logMessage += " | Power: " + parseInt(power, 10);
                }

                log("Sending: " + logMessage);

                const data = await fetchJson(url);
                log("Response: ack=" + data.ack + " body=\"" + (data.body || "") + "\"");
            } catch (err) {
                log("ERROR: " + err.message);
            }
        });

        document.getElementById("btn-telemetry").addEventListener("click", async function () {
            try {
                const robotId = getRobotId();
                if (!validateRobotId(robotId)) {
                    log("ERROR: robotId must be 0 or 1");
                    return;
                }

                const url = "/commands/telem?robotId=" + encodeURIComponent(robotId);
                log("Requesting telemetry for Robot " + robotId + "...");

                const data = await fetchJson(url);

                telemetryOutput.textContent =
                    "Ack:             " + (data.ack ?? "N/A") + "\n" +
                    "LastPktCounter:  " + (data.LastPktCounter ?? "N/A") + "\n" +
                    "CurrentGrade:    " + (data.CurrentGrade ?? "N/A") + "\n" +
                    "HitCount:        " + (data.HitCount ?? "N/A") + "\n" +
                    "Heading:         " + (data.Heading ?? "N/A") + "\n" +
                    "LastCmd:         " + (data.LastCmd ?? "N/A") + "\n" +
                    "LastCmdValue:    " + (data.LastCmdValue ?? "N/A") + "\n" +
                    "LastCmdPower:    " + (data.LastCmdPower ?? "N/A");

                log("Telemetry received successfully");
            } catch (err) {
                telemetryOutput.textContent = "Telemetry request failed.";
                log("ERROR: " + err.message);
            }
        });
    </script>
</body>
</html>
