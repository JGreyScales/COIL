<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIL Robot Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 { margin-bottom: 1.5rem; }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
        }

        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .panel {
            background: #16213e;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 200px;
        }

        .panel label {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.5rem;
        }

        .panel input,
        .panel select {
            padding: 0.5rem;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f3460;
            color: #eee;
            font-size: 1rem;
            width: 100%;
        }

        .btn {
            margin-top: 0.5rem;
            padding: 0.6rem;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-send { background: #27ae60; }
        .btn-send:hover { background: #219150; }
        .btn-telemetry { background: #8e44ad; }
        .btn-telemetry:hover { background: #733a8e; }
        .btn-restart { background: #e67e22; }
        .btn-restart:hover { background: #d35400; }

        .params-panel { display: none; }
        .params-panel.visible { display: flex; }
        .params-panel .param-group { display: none; }
        .params-panel .param-group.visible { display: block; }

        .dpad-panel { align-items: center; }

        .dpad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 6px;
        }

        .dpad-btn {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            color: #fff;
        }

        .dpad-btn:active { transform: scale(0.93); }

        .dpad-btn.up    { grid-column: 2; grid-row: 1; background: #0f3460; }
        .dpad-btn.left  { grid-column: 1; grid-row: 2; background: #0f3460; }
        .dpad-btn.center{ grid-column: 2; grid-row: 2; background: #e94560; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; background: #0f3460; }
        .dpad-btn.down  { grid-column: 2; grid-row: 3; background: #0f3460; }

        .dpad-btn.up:hover,
        .dpad-btn.down:hover,
        .dpad-btn.left:hover,
        .dpad-btn.right:hover { background: #1a5276; }

        .dpad-btn.center:hover { background: #c0392b; }

        .log-panel {
            min-width: 350px;
            max-width: 500px;
        }

        .log-panel pre,
        #telemetry-output {
            background: #0a0a1a;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #telemetry-output {
            min-height: 140px;
            max-height: 300px;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <h1>COIL Robot Controller</h1>

    <div style="margin-bottom:1.5rem; display:flex; align-items:center; gap:1rem;">
        <label for="robot-select" style="font-size:0.9rem; color:#aaa;">Robot #:</label>
        <select id="robot-select">
            <option value="0">Robot 0</option>
            <option value="1">Robot 1</option>
        </select>
    </div>

    <div class="controls-container">
        <div class="panel log-panel">
            <h2>Packet Log</h2>
            <pre id="log-output">Ready.</pre>
        </div>

        <div class="center-column">
            <div class="panel dpad-panel">
                <h2>Movement</h2>
                <div class="dpad">
                    <button class="dpad-btn up" id="btn-forward" title="Forward">&#9650;</button>
                    <button class="dpad-btn left" id="btn-left" title="Left">&#9664;</button>
                    <button class="dpad-btn center" id="btn-sleep" title="Sleep">&#9211;</button>
                    <button class="dpad-btn right" id="btn-right" title="Right">&#9654;</button>
                    <button class="dpad-btn down" id="btn-backward" title="Backward">&#9660;</button>
                </div>
            </div>

            <div class="panel params-panel" id="params-panel">
                <h2 id="params-title">Parameters</h2>

                <div class="param-group" id="group-power">
                    <label for="power">Power (80-100%)</label>
                    <input type="number" id="power" min="80" max="100" value="80" />
                </div>

                <div class="param-group" id="group-duration">
                    <label for="duration">Duration (1-100s)</label>
                    <input type="number" id="duration" min="1" max="100" value="5" />
                </div>

                <button class="btn btn-send" id="btn-send">Send Command</button>
            </div>
        </div>

        <div class="panel">
            <h2>System & Telemetry</h2>
            <button class="btn btn-telemetry" id="btn-telemetry">Request Telemetry</button>
            <button class="btn btn-restart" id="btn-restart">Restart Server</button>
            <pre id="telemetry-output">No telemetry data.</pre>
        </div>
    </div>

    <script>
        const logOutput = document.getElementById("log-output");
        const paramsPanel = document.getElementById("params-panel");
        const paramsTitle = document.getElementById("params-title");
        const groupPower = document.getElementById("group-power");
        const groupDuration = document.getElementById("group-duration");
        const telemetryOutput = document.getElementById("telemetry-output");

        let selectedCommand = null;

        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            logOutput.textContent = `[${timestamp}] ${msg}\n` + logOutput.textContent;
        }

        function getRobotId() {
            return parseInt(document.getElementById("robot-select").value, 10);
        }

        function validatePower(value) {
            const n = parseInt(value, 10);
            return !isNaN(n) && n >= 80 && n <= 100;
        }

        function validateDuration(value) {
            const n = parseInt(value, 10);
            return !isNaN(n) && n >= 1 && n <= 100;
        }

        function showParams(command, fields) {
            selectedCommand = command;
            paramsTitle.textContent = command + " Parameters";

            groupPower.className = "param-group" + (fields.includes("power") ? " visible" : "");
            groupDuration.className = "param-group" + (fields.includes("duration") ? " visible" : "");

            paramsPanel.className = "panel params-panel visible";
        }

        function directionToInt(command) {
            const map = {
                "Forward": 1,
                "Backward": 2,
                "Right": 3,
                "Left": 4
            };
            return map[command];
        }

        function buildDriveUrl(directionInt, robotId, duration, power) {
            let url = `/commands/Drive/${directionInt}?robotId=${robotId}&duration=${duration}`;
            if (power !== null && power !== undefined) {
                url += `&power=${power}`;
            }
            return url;
        }

        async function sendMovementCommand() {
            if (!selectedCommand || selectedCommand === "Sleep") return;

            const robotId = getRobotId();
            const duration = document.getElementById("duration").value;

            if (!validateDuration(duration)) {
                log("ERROR: Duration must be between 1 and 100.");
                return;
            }

            const directionInt = directionToInt(selectedCommand);
            let power = null;
            if (selectedCommand === "Forward" || selectedCommand === "Backward") {
                power = document.getElementById("power").value;
                if (!validatePower(power)) {
                    log("ERROR: Power must be between 80 and 100.");
                    return;
                }
            }

            const url = buildDriveUrl(directionInt, robotId, duration, power);
            log(`Sending ${selectedCommand} to Robot ${robotId} -> ${url}`);

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok) {
                    log(`ERROR: ack=${data.ack ?? 0}, body=${data.body ?? "Request failed"}`);
                    return;
                }
                log(`Response: ack=${data.ack}, body=${data.body}`);
            } catch (err) {
                log(`ERROR: ${err.message}`);
            }
        }

        async function sendSleepCommand() {
            const robotId = getRobotId();
            const url = `/commands/sleep?robotId=${robotId}`;
            log(`Sending Sleep to Robot ${robotId} -> ${url}`);

            try {
                const res = await fetch(url);
                const data = await res.json();
                log(`Sleep Response: ack=${data.ack}, body=${data.body}`);
            } catch (err) {
                log(`Sleep ERROR: ${err.message}`);
            }
        }

        async function sendRestartCommand() {
            const robotId = getRobotId();
            const url = `/commands/restart?robotId=${robotId}`;
            log(`Sending Restart Command -> ${url}`);

            try {
                const res = await fetch(url);
                const data = await res.json();
                log(`Restart Response: ${data.body} (ack=${data.ack})`);
            } catch (err) {
                log(`Restart ERROR: ${err.message}`);
            }
        }

        async function requestTelemetry() {
            const robotId = getRobotId();
            const url = `/commands/telem?robotId=${robotId}`;

            log(`Requesting telemetry for Robot ${robotId} -> ${url}`);

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!res.ok) {
                    telemetryOutput.textContent = `Error:\nack=${data.ack ?? 0}\nbody=${data.body ?? "Request failed"}`;
                    log(`Telemetry ERROR: ack=${data.ack ?? 0}, body=${data.body ?? "Request failed"}`);
                    return;
                }

                telemetryOutput.textContent =
                    `ack: ${data.ack}\n` +
                    `LastPktCounter: ${data.LastPktCounter}\n` +
                    `CurrentGrade: ${data.CurrentGrade}\n` +
                    `HitCount: ${data.HitCount}\n` +
                    `Heading: ${data.Heading}\n` +
                    `LastCmd: ${data.LastCmd}\n` +
                    `LastCmdValue: ${data.LastCmdValue}\n` +
                    `LastCmdPower: ${data.LastCmdPower}`;

                log(`Telemetry received for Robot ${robotId} (ack=${data.ack})`);
            } catch (err) {
                telemetryOutput.textContent = `Error:\n${err.message}`;
                log(`Telemetry ERROR: ${err.message}`);
            }
        }

        // Event Listeners
        document.getElementById("btn-forward").addEventListener("click", () => showParams("Forward", ["power", "duration"]));
        document.getElementById("btn-backward").addEventListener("click", () => showParams("Backward", ["power", "duration"]));
        document.getElementById("btn-left").addEventListener("click", () => showParams("Left", ["duration"]));
        document.getElementById("btn-right").addEventListener("click", () => showParams("Right", ["duration"]));
        
        document.getElementById("btn-sleep").addEventListener("click", function () {
            selectedCommand = "Sleep";
            paramsPanel.className = "panel params-panel"; // Hide parameter panel
            sendSleepCommand();
        });

        document.getElementById("btn-send").addEventListener("click", sendMovementCommand);
        document.getElementById("btn-telemetry").addEventListener("click", requestTelemetry);
        document.getElementById("btn-restart").addEventListener("click", sendRestartCommand);
    </script>
</body>
</html>
