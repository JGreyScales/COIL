<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIL Robot Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 { margin-bottom: 1.5rem; }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        /* Parameters panel */
        .params-panel {
            background: #16213e;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 200px;
        }

        .params-panel label {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.5rem;
        }

        .params-panel input {
            padding: 0.5rem;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f3460;
            color: #eee;
            font-size: 1rem;
            width: 100%;
        }

        /* D-Pad */
        .dpad-panel {
            background: #16213e;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dpad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 6px;
        }

        .dpad-btn {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            color: #fff;
        }

        .dpad-btn:active { transform: scale(0.93); }

        .dpad-btn.up    { grid-column: 2; grid-row: 1; background: #0f3460; }
        .dpad-btn.left  { grid-column: 1; grid-row: 2; background: #0f3460; }
        .dpad-btn.center{ grid-column: 2; grid-row: 2; background: #e94560; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; background: #0f3460; }
        .dpad-btn.down  { grid-column: 2; grid-row: 3; background: #0f3460; }

        .dpad-btn.up:hover,
        .dpad-btn.down:hover,
        .dpad-btn.left:hover,
        .dpad-btn.right:hover { background: #1a5276; }

        .dpad-btn.center:hover { background: #c0392b; }

        /* Status panel */
        .status-panel {
            background: #16213e;
            padding: 1.5rem;
            border-radius: 12px;
            min-width: 250px;
        }

        .status-panel pre {
            background: #0a0a1a;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            min-height: 120px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>COIL Robot Controller</h1>

    <div class="controls-container">
        <!-- Parameter Inputs -->
        <div class="params-panel">
            <h2>Parameters</h2>
            <label for="power">Power (80-100%)</label>
            <input type="number" id="power" min="80" max="100" value="80" />

            <label for="duration">Duration (1-100s)</label>
            <input type="number" id="duration" min="1" max="100" value="5" />

            <label for="robotId">Robot ID (0 or 1)</label>
            <input type="number" id="robotId" min="0" max="1" value="0" />
        </div>

        <!-- D-Pad Controls -->
        <div class="dpad-panel">
            <h2>Movement</h2>
            <div class="dpad">
                <button class="dpad-btn up" id="btn-forward" title="Forward">&#9650;</button>
                <button class="dpad-btn left" id="btn-left" title="Left">&#9664;</button>
                <button class="dpad-btn center" id="btn-sleep" title="Sleep">&#9211;</button>
                <button class="dpad-btn right" id="btn-right" title="Right">&#9654;</button>
                <button class="dpad-btn down" id="btn-backward" title="Backward">&#9660;</button>
            </div>
        </div>

        <!-- Status Log -->
        <div class="status-panel">
            <h2>Status</h2>
            <pre id="status-output">Ready.</pre>
        </div>
    </div>

    <script>
        var statusOutput = document.getElementById("status-output");

        function log(msg) {
            statusOutput.textContent = msg + "\n" + statusOutput.textContent;
        }

        function getParams() {
            return {
                power: document.getElementById("power").value,
                duration: document.getElementById("duration").value,
                robotId: document.getElementById("robotId").value
            };
        }

        document.getElementById("btn-forward").addEventListener("click", function() {
            var p = getParams();
            log("Forward | Power: " + p.power + " | Duration: " + p.duration + "s | Robot: " + p.robotId);
        });

        document.getElementById("btn-backward").addEventListener("click", function() {
            var p = getParams();
            log("Backward | Power: " + p.power + " | Duration: " + p.duration + "s | Robot: " + p.robotId);
        });

        document.getElementById("btn-left").addEventListener("click", function() {
            var p = getParams();
            log("Left | Duration: " + p.duration + "s | Robot: " + p.robotId);
        });

        document.getElementById("btn-right").addEventListener("click", function() {
            var p = getParams();
            log("Right | Duration: " + p.duration + "s | Robot: " + p.robotId);
        });

        document.getElementById("btn-sleep").addEventListener("click", function() {
            var p = getParams();
            log("Sleep | Robot: " + p.robotId);
        });
    </script>
</body>
</html>
